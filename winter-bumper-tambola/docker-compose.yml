version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: wbt-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: winter-bumper-tambola
    networks:
      - wbt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wbt-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/winter-bumper-tambola
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_min32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_in_production_min32chars}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      - mongodb
    networks:
      - wbt-network
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: wbt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wbt-network

networks:
  wbt-network:
    driver: bridge

volumes:
  mongo_data:
